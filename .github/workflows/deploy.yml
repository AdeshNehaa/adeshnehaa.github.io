# Builds the site and publishes it to GitHub Pages.
# Runs when you push to the `main` branch, or when started by hand from the Actions tab.
# One-time setup: repository Settings → Pages → Source → "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read the GitHub Pages address
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # e.g. "/Aadesh-Neha-Wedding/" — empty + "/" for a user site or custom domain
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # e.g. "https://<user>.github.io/Aadesh-Neha-Wedding/" — used for social preview links
          SITE_URL: ${{ steps.pages.outputs.base_url }}/

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
