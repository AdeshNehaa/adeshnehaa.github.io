# Dependabot keeps the pinned GitHub Actions in the deploy workflow up to date
# by opening a pull request when one of them has a newer version.
#
# npm packages are deliberately not listed here: routine upgrades (for example a new
# major version of React) are not wanted on a finished invitation. Security fixes for
# npm packages still arrive, through "Dependabot security updates" in the repository
# settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
